_schema-version: "3.2"
ID: guardengine
description: Generated by Fiori Tools
version: 0.0.1

modules:
# Custom Router Module
- name: guardengine-router
  type: nodejs
  path: approuter
  requires:
    - name: guardengine-destination-service
    - name: guardengine-auth 
    - name: guardengine-repo-runtime
  provides: 
    - name: guardengine-router-api
      properties:
        url: ${default-url}

# Destination Content Module
- name: guardengine-destination-content
  type: com.sap.application.content
  requires:
  - name: guardengine-destination-service
    parameters:
      content-target: true
  - name: guardengine-repo-host
    parameters:
      service-key:
        name: guardengine-repo-host-key
  - name: guardengine-auth
    parameters:
      service-key:
        name: guardengine-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: guardengine_html_repo_host
          ServiceInstanceName: guardengine-html5-service
          ServiceKeyName: guardengine-repo-host-key
          sap.cloud.service: guardengine
        - Authentication: OAuth2UserTokenExchange
          Name: guardengine_auth
          ServiceInstanceName: guardengine-xsuaa-service
          ServiceKeyName: guardengine-auth-key
          sap.cloud.service: guardengine
        existing_destinations_policy: update
  build-parameters:
    no-source: true

# Application Content Module
- name: guardengine-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: guardengine-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - guardengine.zip
      name: guardengine
      target-path: resources/

# Application Module
- name: guardengine
  type: html5
  path: .
  requires:
  - name: guardengine-destination-service
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []

resources:

# Destination Service
- name: guardengine-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: guardengine-destination-service
    service-plan: lite

# Authentication Service XSUAA
- name: guardengine-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: guardengine-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-name: guardengine-xsuaa-service
    service-plan: application

# HTML5 Repo Service
- name: guardengine-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: guardengine-html5-service
    service-plan: app-host

# Runtime needed by the approuter to serve the HTML5 app content from the HTML5 repo service
- name: guardengine-repo-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime 

parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
